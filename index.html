<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>히토미 검색 도우미</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #f7fafd;
      color: #3d4149;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      color: #4a6fa5;
      margin-bottom: 24px;
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    #numberInput {
      flex: 1;
      padding: 12px 14px;
      font-size: 16px;
      background: #ffffff;
      color: #3d4149;
      border: 1px solid #d5e2f2;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    #numberInput:focus {
      border-color: #6E9FE0;
    }
    #generateBtn {
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: #6E9FE0;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    #generateBtn:hover {
      background: #5b8bd0;
    }
    .hint {
      font-size: 13px;
      color: #93a3b8;
      margin-bottom: 20px;
    }
    #result {
      min-height: 24px;
    }
    .result-box {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .result-box a {
      flex: 1;
      display: block;
      padding: 14px;
      background: #E9F7F0;
      border: 1px solid #cceadd;
      border-radius: 10px;
      color: #3d9470;
      text-decoration: none;
      word-break: break-all;
      font-size: 15px;
      transition: background 0.15s;
    }
    .result-box a:hover {
      background: #ddf2e8;
    }
    #copyBtn {
      padding: 0 16px;
      font-size: 14px;
      font-weight: 600;
      color: #3d9470;
      background: #ffffff;
      border: 1px solid #cceadd;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    #copyBtn:hover {
      background: #E9F7F0;
    }
    .copy-guide {
      font-size: 12px;
      color: #93a3b8;
      margin-top: 10px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>히토미 검색 도우미</h1>

    <div class="input-row">
      <input
        type="text"
        id="numberInput"
        inputmode="numeric"
        placeholder="품번을 입력해주세요"
        autocomplete="off"
      >
      <button id="generateBtn">확인</button>
    </div>

    <p class="hint">품번을 입력해주세요 <span style="color:#b3c0d0;">(숫자만 입력 가능해요)</span></p>

    <div id="result"></div>
  </div>

  <script>
    const input = document.getElementById('numberInput');
    const btn = document.getElementById('generateBtn');
    const result = document.getElementById('result');

    // 숫자만 입력되도록 필터
    input.addEventListener('input', function () {
      input.value = input.value.replace(/[^0-9]/g, '');
    });

    function generate() {
      const num = input.value.trim();
      if (!num) {
        result.innerHTML = '';
        return;
      }
      const url = 'https://hitomi.la/reader/' + num + '.html#1';
      result.innerHTML =
        '<div class="result-box">' +
          '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>' +
          '<button id="copyBtn">복사</button>' +
        '</div>' +
        '<p class="copy-guide">링크를 클릭하면 바로 이동, 복사도 가능해요.</p>';

      const copyBtn = document.getElementById('copyBtn');
      copyBtn.addEventListener('click', function () {
        navigator.clipboard.writeText(url).then(function () {
          copyBtn.textContent = '완료';
          setTimeout(function () { copyBtn.textContent = '복사'; }, 1200);
        }).catch(function () {
          // 클립보드 API가 막힌 환경 대비
          const tmp = document.createElement('textarea');
          tmp.value = url;
          document.body.appendChild(tmp);
          tmp.select();
          document.execCommand('copy');
          document.body.removeChild(tmp);
          copyBtn.textContent = '완료';
          setTimeout(function () { copyBtn.textContent = '복사'; }, 1200);
        });
      });
    }

    btn.addEventListener('click', generate);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') generate();
    });
  </script>
</body>
</html>
