<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>히토미 검색 도우미</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #f7fafd;
      color: #3d4149;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      color: #4a6fa5;
      margin-bottom: 24px;
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    #numberInput {
      flex: 1;
      padding: 12px 14px;
      font-size: 16px;
      background: #ffffff;
      color: #3d4149;
      border: 1px solid #d5e2f2;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    #numberInput:focus {
      border-color: #6E9FE0;
    }
    #generateBtn {
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: #6E9FE0;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    #generateBtn:hover {
      background: #5b8bd0;
    }
    .hint {
      font-size: 13px;
      color: #93a3b8;
      margin-bottom: 20px;
    }
    #result {
      min-height: 24px;
    }
    .result-box {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .result-box a {
      flex: 1;
      display: block;
      padding: 14px;
      background: #E9F7F0;
      border: 1px solid #cceadd;
      border-radius: 10px;
      color: #3d9470;
      text-decoration: none;
      word-break: break-all;
      font-size: 15px;
      transition: background 0.15s;
    }
    .result-box a:hover {
      background: #ddf2e8;
    }
    #copyBtn {
      padding: 0 16px;
      font-size: 14px;
      font-weight: 600;
      color: #3d9470;
      background: #ffffff;
      border: 1px solid #cceadd;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    #copyBtn:hover {
      background: #E9F7F0;
    }
    .copy-guide {
      font-size: 12px;
      color: #93a3b8;
      margin-top: 10px;
      line-height: 1.5;
    }
    .recent {
      margin-top: 28px;
    }
    .recent-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .recent-title {
      font-size: 13px;
      font-weight: 600;
      color: #7a8ba0;
    }
    .recent-clear {
      font-size: 12px;
      color: #b3c0d0;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
    }
    .recent-clear:hover {
      color: #7a8ba0;
    }
    .recent-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .recent-chip {
      padding: 7px 12px;
      font-size: 14px;
      color: #4a6fa5;
      background: #EAF1FC;
      border: 1px solid #d5e2f2;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .recent-chip:hover {
      background: #dfeafb;
    }
    .archive {
      margin-top: 40px;
      padding-top: 28px;
      border-top: 1px solid #e3e9f0;
    }
    .archive-title {
      font-size: 16px;
      font-weight: 700;
      color: #4a6fa5;
      margin-bottom: 4px;
    }
    .archive-sub {
      font-size: 12px;
      color: #93a3b8;
      margin-bottom: 16px;
    }
    .archive-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .archive-item {
      display: block;
      padding: 13px 15px;
      background: #ffffff;
      border: 1px solid #e3e9f0;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .archive-item:hover {
      background: #f7fafd;
      border-color: #d5e2f2;
    }
    .archive-item .a-title {
      font-size: 14px;
      font-weight: 600;
      color: #3d4149;
      margin-bottom: 2px;
      word-break: break-all;
    }
    .archive-item .a-num {
      font-size: 12px;
      color: #93a3b8;
    }
    .archive-item .a-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }
    .a-tag {
      display: inline-block;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 999px;
      border: 1px solid #e3e9f0;
      background: #f4f6f9;
      color: #7a8ba0;
    }
    .a-tag.t-male { color: #4a6fa5; background: #EAF1FC; border-color: #cddff5; }
    .a-tag.t-female { color: #c0607a; background: #FCEAF1; border-color: #f3cdda; }
    .a-tag.t-love { color: #d17ba0; background: #FCEFF5; border-color: #f5d5e5; }
    .archive-empty {
      font-size: 13px;
      color: #b3c0d0;
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>히토미 검색 도우미</h1>

    <div class="input-row">
      <input
        type="text"
        id="numberInput"
        inputmode="numeric"
        placeholder="번호 입력"
        autocomplete="off"
      >
      <button id="generateBtn">확인</button>
    </div>

    <p class="hint">품번을 입력해주세요 <span style="color:#b3c0d0;">(숫자만 입력 가능)</span></p>

    <div id="result"></div>

    <div class="recent" id="recent" style="display:none;">
      <div class="recent-head">
        <span class="recent-title">최근 검색</span>
        <button class="recent-clear" id="recentClear">전체 삭제</button>
      </div>
      <div class="recent-list" id="recentList"></div>
    </div>

    <div class="archive">
      <div class="archive-title">아카이브 목록</div>
      <div class="archive-sub">제목을 누르면 해당 작품으로 이동해요.</div>
      <div class="archive-list" id="archiveList">
        <p class="archive-empty">목록을 불러오는 중...</p>
      </div>
    </div>
  </div>

  <script>
    const input = document.getElementById('numberInput');
    const btn = document.getElementById('generateBtn');
    const result = document.getElementById('result');
    const recent = document.getElementById('recent');
    const recentList = document.getElementById('recentList');
    const recentClear = document.getElementById('recentClear');

    const STORAGE_KEY = 'hitomi_recent';
    const MAX_RECENT = 10;

    // 숫자만 입력되도록 필터
    input.addEventListener('input', function () {
      input.value = input.value.replace(/[^0-9]/g, '');
    });

    function loadRecent() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveRecent(list) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      } catch (e) {}
    }

    function addRecent(num) {
      let list = loadRecent();
      list = list.filter(function (n) { return n !== num; }); // 중복 제거
      list.unshift(num); // 맨 앞에 추가
      list = list.slice(0, MAX_RECENT); // 최대 5개
      saveRecent(list);
      renderRecent();
    }

    function renderRecent() {
      const list = loadRecent();
      if (list.length === 0) {
        recent.style.display = 'none';
        return;
      }
      recent.style.display = 'block';
      recentList.innerHTML = '';
      list.forEach(function (num) {
        const chip = document.createElement('button');
        chip.className = 'recent-chip';
        chip.textContent = num;
        chip.addEventListener('click', function () {
          input.value = num;
          generate();
        });
        recentList.appendChild(chip);
      });
    }

    recentClear.addEventListener('click', function () {
      saveRecent([]);
      renderRecent();
    });

    function generate() {
      const num = input.value.trim();
      if (!num) {
        result.innerHTML = '';
        return;
      }
      const url = 'https://hitomi.la/reader/' + num + '.html#1';
      result.innerHTML =
        '<div class="result-box">' +
          '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>' +
          '<button id="copyBtn">복사</button>' +
        '</div>' +
        '<p class="copy-guide">링크를 클릭하거나, 복사 버튼을 누른 뒤 브라우저에 붙여넣으세요.</p>';

      addRecent(num);

      const copyBtn = document.getElementById('copyBtn');
      copyBtn.addEventListener('click', function () {
        navigator.clipboard.writeText(url).then(function () {
          copyBtn.textContent = '완료';
          setTimeout(function () { copyBtn.textContent = '복사'; }, 1200);
        }).catch(function () {
          // 클립보드 API가 막힌 환경 대비
          const tmp = document.createElement('textarea');
          tmp.value = url;
          document.body.appendChild(tmp);
          tmp.select();
          document.execCommand('copy');
          document.body.removeChild(tmp);
          copyBtn.textContent = '완료';
          setTimeout(function () { copyBtn.textContent = '복사'; }, 1200);
        });
      });
    }

    btn.addEventListener('click', generate);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') generate();
    });

    // 페이지 로드 시 최근 검색 표시
    renderRecent();

    // 아카이브 목록 불러오기 (list.json)
    const archiveList = document.getElementById('archiveList');

    // 태그 색상 규칙
    function tagClass(tag) {
      if (tag === '단독 남성') return 't-male';
      if (tag === '단독 여성') return 't-female';
      if (tag === '순애') return 't-love';
      return '';
    }

    fetch('list.json?t=' + Date.now())
      .then(function (res) {
        if (!res.ok) throw new Error('load failed');
        return res.json();
      })
      .then(function (data) {
        if (!Array.isArray(data) || data.length === 0) {
          archiveList.innerHTML = '<p class="archive-empty">아직 등록된 항목이 없어요.</p>';
          return;
        }
        archiveList.innerHTML = '';
        data.forEach(function (item) {
          if (!item || !item.num) return;
          const a = document.createElement('a');
          a.className = 'archive-item';
          a.href = 'https://hitomi.la/reader/' + item.num + '.html#1';
          a.target = '_blank';
          a.rel = 'noopener noreferrer';

          const titleDiv = document.createElement('div');
          titleDiv.className = 'a-title';
          titleDiv.textContent = item.title || ('작품 ' + item.num);

          const numDiv = document.createElement('div');
          numDiv.className = 'a-num';
          numDiv.textContent = '품번 ' + item.num;

          a.appendChild(titleDiv);
          a.appendChild(numDiv);

          if (Array.isArray(item.tags) && item.tags.length) {
            const tagWrap = document.createElement('div');
            tagWrap.className = 'a-tags';
            item.tags.forEach(function (tag) {
              const span = document.createElement('span');
              span.className = 'a-tag ' + tagClass(tag);
              span.textContent = tag;
              tagWrap.appendChild(span);
            });
            a.appendChild(tagWrap);
          }

          archiveList.appendChild(a);
        });
      })
      .catch(function () {
        archiveList.innerHTML = '<p class="archive-empty">목록을 불러오지 못했어요.</p>';
      });
  </script>
</body>
</html>
